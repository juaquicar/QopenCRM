{% extends "base.html" %}{% load crm %}
{% block title %}Contactos · QopenCRM{% endblock %}
{% block content %}
<div class="page-head hide-m">
  <div><span class="eyebrow">Personas</span><h1 style="margin-top:8px">Contactos</h1></div>
  <button class="btn" data-modal="{% url 'modal_new' 'contact' %}">{% icon "plus" %}Contacto</button>
</div>
<form class="filters" hx-get="{% url 'contacts' %}" hx-target="#rows" hx-swap="outerHTML" hx-push-url="true" hx-trigger="change, input changed delay:300ms from:input[name=q]">
  <div class="search"><input type="search" name="q" value="{{ filter.form.q.value|default:'' }}" placeholder="Buscar por nombre, correo, cargo o empresa…" aria-label="Buscar" enterkeyhint="search"></div>
  <button type="button" class="iconbtn only-m{% if request.GET.legal_basis %} active{% endif %}" data-filters aria-label="Filtros" aria-expanded="false">{% icon "filter" %}</button>
  <div class="filter-panel">{{ filter.form.legal_basis }}</div>
</form>
<div class="card flush"><div class="table-wrap"><table class="mlist">
  <thead><tr><th>Persona</th><th>Empresas</th><th class="hide-m">Correo</th><th class="hide-m">Teléfono</th><th>RGPD</th><th></th></tr></thead>
  {% include "crm/_contact_rows.html" %}
</table></div></div>
{% endblock %}
