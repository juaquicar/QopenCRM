{% extends "base.html" %}{% load crm %}
{% block title %}Buscar · QopenCRM{% endblock %}
{% block content %}
<div class="page-head hide-m"><div><span class="eyebrow">Todo el CRM</span><h1 style="margin-top:8px">Buscar</h1></div></div>
<form class="filters" method="get" hx-get="{% url 'search' %}" hx-target="#results" hx-swap="outerHTML" hx-push-url="true" hx-trigger="input changed delay:250ms from:input[name=q], submit">
  <div class="search wide"><input type="search" name="q" value="{{ q }}" placeholder="Empresa, persona, oportunidad, teléfono, correo…" aria-label="Buscar" autofocus enterkeyhint="search" autocomplete="off"></div>
</form>
{% include "crm/_search_results.html" %}
{% endblock %}
