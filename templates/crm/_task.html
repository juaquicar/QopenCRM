{% load crm %}
<div class="task {% if t.done_at %}done{% endif %}">
  <button class="tick" hx-post="{% url 'task_toggle' t.pk %}" hx-swap="none" aria-label="{% if t.done_at %}Reabrir{% else %}Marcar como hecha{% endif %}"></button>
  <div class="grow">
    <div class="tt">{{ t.title }}</div>
    <div class="meta">
      <span class="{% if t.is_overdue %}late{% endif %}">{{ t.due_at|due }}</span>
      {% if t.kind != "todo" %}<span>{{ t.get_kind_display }}</span>{% endif %}
      {% if show_context %}{% if t.opportunity %}<a class="link" href="{% url 'opportunity' t.opportunity_id %}">{{ t.opportunity }}</a>{% elif t.company %}<a class="link" href="{% url 'company' t.company_id %}">{{ t.company }}</a>{% endif %}{% endif %}
      {% if t.assignee_id != user.pk %}<span>{{ t.assignee }}</span>{% endif %}
    </div>
  </div>
  <button class="iconbtn" style="width:28px;height:28px;border:0" data-modal="{% url 'modal_edit' 'task' t.pk %}" aria-label="Editar tarea">{% icon "edit" %}</button>
</div>
