[project]
name = "qopencrm"
version = "0.1.0"
description = "CRM comercial de código abierto con IA: pipeline, presupuestos en PDF, suscripciones, API REST y servidor MCP."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Juanma Quijada" }]
keywords = ["crm", "sales", "ai", "mcp", "django", "htmx", "self-hosted", "open-source"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 6.1",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Spanish",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business",
]
requires-python = ">=3.14"
dependencies = [
    "cryptography>=50.0.2",
    "django>=6.1.3",
    "django-filter>=26.2",
    "djangorestframework>=3.18.3",
    "drf-spectacular>=0.30.0",
    "gunicorn>=27.0.1",
    "markdown>=3.11.3",
    "nh3>=0.3.8",
    "psycopg[binary]>=3.3.9",
    "python-dotenv>=1.2.4",
    "weasyprint>=70.0",
    "whitenoise>=6.12.0",
]

[project.urls]
Homepage = "https://github.com/juaquicar/QopenCRM"
Documentation = "https://github.com/juaquicar/QopenCRM#documentación"
Issues = "https://github.com/juaquicar/QopenCRM/issues"
Changelog = "https://github.com/juaquicar/QopenCRM/blob/main/CHANGELOG.md"
