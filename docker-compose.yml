# QopenCRM: base de datos, web y tareas en segundo plano. Se gestiona con ./qopencrm.sh
name: qopencrm

x-app: &app
  build: .
  image: qopencrm:latest
  restart: unless-stopped
  env_file: .env
  environment:
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    DJANGO_DEBUG: "0"
    MEDIA_ROOT: /app/media
  volumes:
    - media:/app/media
    - ./branding:/app/branding:ro
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    <<: *app
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DJANGO_DEBUG: "0"
      MEDIA_ROOT: /app/media
      RUN_MIGRATIONS: "1"
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/entrar/', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 6s
      retries: 8
      start_period: 25s

  # recordatorios por correo, resumen diario y reintentos de webhooks
  worker:
    <<: *app
    command: ["python", "manage.py", "runworker"]
    depends_on:
      web:
        condition: service_healthy

volumes:
  pgdata:
  media:
