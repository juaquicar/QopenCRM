name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: qopencrm
          POSTGRES_USER: qopencrm
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qopencrm"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DJANGO_SECRET_KEY: ci-only-not-secret
      DJANGO_DEBUG: "0"
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: qopencrm
      POSTGRES_USER: qopencrm
      POSTGRES_PASSWORD: ci
    steps:
      - uses: actions/checkout@v4
      - name: Bibliotecas de WeasyPrint (PDF)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Dependencias
        run: uv sync --frozen
      - name: Migraciones al día
        run: uv run python manage.py makemigrations --check --dry-run
      - name: Pruebas
        run: uv run python manage.py test apps
